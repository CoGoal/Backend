spring.application.name=CoGoal-main

spring.datasource.url=jdbc:h2:mem:cogoal;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP
spring.liquibase.change-log=classpath:db/db.changelog-master.xml

eureka.client.enabled=false
security.jwt.secret=test-key-at-least-thirty-two-characters-long
security.jwt.issuer=pact-auth
security.jwt.audience=pact-main
security.jwt.access-token-ttl=15m
security.jwt.clock-skew=30s
app.profile.initial-coins=100
spring.cloud.compatibility-verifier.enabled=false

spring.kafka.admin.auto-create=false
spring.kafka.listener.auto-startup=false
app.kafka.profile-topic=cogoal.user-profiles.v1
app.kafka.profile-group=cogoal-main-profiles-test
app.kafka.partitions=3
