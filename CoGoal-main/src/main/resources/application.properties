spring.application.name=CoGoal-main

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/CoGoal}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP

# Liquibase
spring.liquibase.change-log=classpath:db/db.changelog-master.xml

# Actuator
management.endpoints.web.exposure.include=health,info

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=cogoal-main
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

spring.cloud.compatibility-verifier.enabled=false
eureka.client.enabled=${EUREKA_ENABLED:true}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:localhost}
security.jwt.secret=${JWT_SECRET:}
security.jwt.issuer=${JWT_ISSUER:pact-auth}
security.jwt.audience=${JWT_AUDIENCE:pact-main}
security.jwt.access-token-ttl=15m
security.jwt.clock-skew=30s
app.profile.initial-coins=${INITIAL_COINS:100}

spring.kafka.consumer.enable-auto-commit=false
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.delivery.timeout.ms=15000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.max.block.ms=10000
app.kafka.profile-topic=${KAFKA_PROFILE_TOPIC:cogoal.user-profiles.v1}
app.kafka.profile-group=${KAFKA_PROFILE_GROUP:cogoal-main-profiles-v1}
app.kafka.partitions=3
