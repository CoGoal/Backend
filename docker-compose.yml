services:
  postgres:
    image: postgres:18
    container_name: cogoal-postgres
    environment:
      POSTGRES_DB: CoGoal
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d CoGoal"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:4.1.0
    container_name: cogoal-kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      # Одна нода в режиме KRaft (без ZooKeeper)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # INTERNAL — для контейнеров в сети compose, EXTERNAL — для доступа с хоста (localhost:9092)
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  cogoal-main:
    build:
      context: ./CoGoal-main
    container_name: cogoal-main
    environment:
      DB_URL: ${MAIN_DB_URL:-jdbc:postgresql://postgres:5432/CoGoal}
      DB_USERNAME: ${MAIN_DB_USERNAME:-${POSTGRES_USER:-postgres}}
      DB_PASSWORD: ${MAIN_DB_PASSWORD:-${POSTGRES_PASSWORD:-postgres}}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_PROFILE_TOPIC: ${KAFKA_PROFILE_TOPIC:-cogoal.user-profiles.v1}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      KAFKA_PROFILE_GROUP: ${KAFKA_PROFILE_GROUP:-cogoal-main-profiles-v1}
      INITIAL_COINS: ${INITIAL_COINS:-100}
      EUREKA_URL: http://eureka:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: cogoal-main
    expose: ["8080"]
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka:
        condition: service_healthy

  auth-db-init:
    image: postgres:18
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
    command: ["psql", "-h", "postgres", "-U", "${POSTGRES_USER:-postgres}", "-d", "postgres", "-v", "ON_ERROR_STOP=1", "-f", "/init/ensure-auth-db.sql"]
    volumes:
      - ./postgres/ensure-auth-db.sql:/init/ensure-auth-db.sql:ro
    depends_on:
      postgres: {condition: service_healthy}

  eureka:
    build: ./CoGoal-eureka
    environment:
      EUREKA_INSTANCE_HOSTNAME: eureka
    ports: ["8761:8761"]
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  mailpit:
    image: axllent/mailpit:v1.21
    ports: ["127.0.0.1:8025:8025"]

  auth:
    build: ./CoGoal-auth
    environment:
      DB_URL: ${AUTH_DB_URL:-jdbc:postgresql://postgres:5432/cg-auth}
      DB_USERNAME: ${AUTH_DB_USERNAME:-${POSTGRES_USER:-postgres}}
      DB_PASSWORD: ${AUTH_DB_PASSWORD:-${POSTGRES_PASSWORD:-postgres}}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_PROFILE_TOPIC: ${KAFKA_PROFILE_TOPIC:-cogoal.user-profiles.v1}
      EUREKA_URL: http://eureka:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: auth
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      MAIL_FROM: ${MAIL_FROM:-noreply@cogoal.local}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
    expose: ["8081"]
    depends_on:
      auth-db-init: {condition: service_completed_successfully}
      eureka: {condition: service_healthy}
      mailpit: {condition: service_started}
      kafka: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  gateway:
    build: ./CoGoal-gateway
    environment:
      EUREKA_URL: http://eureka:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: gateway
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
    ports: ["8080:8080"]
    depends_on:
      eureka: {condition: service_healthy}
      auth: {condition: service_healthy}
      cogoal-main: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

volumes:
  postgres-data:
  kafka-data:
