server:
  port: ${SERVER_PORT:8761}

spring:
  application:
    name: CoGoal-eureka

eureka:
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
  client:
    # A single standalone registry: it neither registers itself nor fetches from peers
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/
  server:
    # Few instances that are restarted often: drop dead ones instead of keeping them "just in case"
    enable-self-preservation: ${EUREKA_SELF_PRESERVATION:false}
    eviction-interval-timer-in-ms: 10000

management:
  endpoints:
    web:
      exposure:
        include: health
